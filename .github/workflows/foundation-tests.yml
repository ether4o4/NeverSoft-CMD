name: Foundation regression tests
on:
  push:
    branches: [development/next-generation-foundation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: for script in scripts/*.sh; do bash -n "$script"; done

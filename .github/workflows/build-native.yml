name: Build NeverSoft Native APK
# Builds are unverified test artifacts. This workflow cannot overwrite releases.

on:
  push:
    branches: [main, development/next-generation-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git curl zip unzip xz-utils zstd dpkg-dev

      - name: Make build scripts executable
        run: chmod +x scripts/*.sh

      - name: Show Docker environment
        run: |
          docker --version
          docker info

      - name: Build legacy compatibility baseline APK
        run: ./scripts/phase1-native-base.sh

      - name: Stage release APK with stable name
        id: stage
        run: |
          set -euo pipefail
          mkdir -p release
          apk="$(find artifacts/apk -type f -name '*.apk' | sort | head -n1)"
          if [ -z "$apk" ]; then
            echo "ERROR: no APK produced by the build" >&2
            exit 1
          fi
          cp -f "$apk" release/neversoft-cmd.apk
          sha256sum release/neversoft-cmd.apk | tee release/neversoft-cmd.apk.sha256
          ls -l release/
          echo "size=$(stat -c%s release/neversoft-cmd.apk)" >> "$GITHUB_OUTPUT"

      - name: Upload NeverSoft APK
        uses: actions/upload-artifact@v4
        with:
          name: NeverSoft-compatibility-arm64-${{ github.sha }}
          path: artifacts/apk/*.apk
          if-no-files-found: error

      - name: Upload bootstrap and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeverSoft-build-artifacts
          path: |
            artifacts/bootstrap/**
            artifacts/reports/**
          if-no-files-found: warn

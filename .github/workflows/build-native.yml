name: Build NeverSoft Native APK
# Pull requests validate artifacts; main publishes the rolling installable release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git curl zip unzip xz-utils zstd dpkg-dev

      - name: Make build scripts executable
        run: chmod +x scripts/*.sh

      - name: Show Docker environment
        run: |
          docker --version
          docker info

      - name: Build custom bootstrap and APK
        run: ./scripts/phase1-native-base.sh

      - name: Stage release APK with stable name
        id: stage
        run: |
          set -euo pipefail
          mkdir -p release
          apk="$(find artifacts/apk -type f -name '*.apk' | sort | head -n1)"
          if [ -z "$apk" ]; then
            echo "ERROR: no APK produced by the build" >&2
            exit 1
          fi
          cp -f "$apk" release/neversoft-cmd.apk
          sha256sum release/neversoft-cmd.apk | tee release/neversoft-cmd.apk.sha256
          ls -l release/
          echo "size=$(stat -c%s release/neversoft-cmd.apk)" >> "$GITHUB_OUTPUT"

      - name: Upload NeverSoft APK
        uses: actions/upload-artifact@v4
        with:
          name: NeverSoft-native-arm64
          path: artifacts/apk/*.apk
          if-no-files-found: error

      - name: Upload bootstrap and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeverSoft-build-artifacts
          path: |
            artifacts/bootstrap/**
            artifacts/reports/**
          if-no-files-found: warn

      - name: Move rolling tag to this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/android-latest" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/android-latest" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref=refs/tags/android-latest -f sha="${GITHUB_SHA}" >/dev/null
          fi
          echo "android-latest -> ${GITHUB_SHA}"

      - name: Publish rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: NeverSoft CMD (latest build)
          body: |
            Rolling ARM64 debug build of NeverSoft CMD.

            - Commit: `${{ github.sha }}`
            - Built: `${{ github.run_id }}` / run #${{ github.run_number }}
            - App ID: `com.neversoft.shell`
            - ABI: `arm64-v8a`

            Download: `neversoft-cmd.apk` (debug-signed; enable install from unknown sources).
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release/neversoft-cmd.apk
            release/neversoft-cmd.apk.sha256
